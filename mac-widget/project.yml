name: AlexdbWidgets
options:
  bundleIdPrefix: xyz.alexdb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "MacWin Dev"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  AlexdbWidgets:
    type: application
    platform: macOS
    sources: [AlexdbWidgets]
    info:
      path: AlexdbWidgets/Info.plist
      properties:
        CFBundleDisplayName: alexdb Widgets
        LSUIElement: false
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.alexdb.widgets
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: AlexdbWidgets/AlexdbWidgets.entitlements
    dependencies:
      - target: AlexdbWidgetExtension
        embed: true
  AlexdbWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [AlexdbWidgetExtension]
    info:
      path: AlexdbWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: alexdb
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.alexdb.widgets.extension
        CODE_SIGN_ENTITLEMENTS: AlexdbWidgetExtension/AlexdbWidgetExtension.entitlements
