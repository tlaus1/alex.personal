      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      justify-content: center;
      padding: 32px;

      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;

      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
      font-weight: 400;

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: -2;
      pointer-events: none;

      0%   { transform: translate3d(0%, 0%, 0) rotate(0deg) scale(1); }

      100% { transform: translate3d(-1%, 1%, 0) rotate(4deg) scale(1.03); }

      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
