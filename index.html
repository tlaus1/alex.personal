    * { box-sizing: border-box; margin: 0; padding: 0; }

      color: var(--text);

      margin: 0;
      overflow: hidden;

    /* Loading spinner */
    .staticrypt-spinner-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .staticrypt-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Main content wrapper */
    .staticrypt-content {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      animation: fadeIn 0.4s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Login card */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 32px 32px;
      text-align: center;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #4a4a4f 0%, #1d1d1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 500;
      color: var(--text);
      border: 1px solid var(--border-strong);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .user-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .user-hint {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
      font-weight: 400;
    }

    #staticrypt-form { margin: 0; }

    .staticrypt-password-container {
      position: relative;
      margin-bottom: 12px;
    }

      letter-spacing: 4px;

      color: var(--text-dimmer);

    .staticrypt-remember { display: none !important; }

    .staticrypt-decrypt-button {

      top: 4px;

      80% { transform: translateX(6px); }

    .login-card.shake { animation: shake 0.45s var(--ease); }

    /* Animated mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 22%, rgba(10, 132, 255, 0.22) 0%, transparent 38%),
        radial-gradient(circle at 80% 72%, rgba(125, 80, 240, 0.20) 0%, transparent 38%),
        radial-gradient(circle at 60% 28%, rgba(255, 80, 180, 0.10) 0%, transparent 32%),

      will-change: transform;

      0%   { transform: translate3d(0%, 0%, 0) rotate(0deg) scale(1); }

      100% { transform: translate3d(-1%, 1%, 0) rotate(4deg) scale(1.03); }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.04;
      mix-blend-mode: overlay;
