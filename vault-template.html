<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
<head>

  <script>
    // Gate: this vault is only reachable THROUGH the decoy's reveal gesture. A direct
    // hit on /app (typed URL, bookmark, guessed link) has no reveal flag → bounce back
    // to the decoy so the disguise holds. The gesture sets sessionStorage 'r'='1'.
    (function () {
      var ok = false;
      try { ok = sessionStorage.getItem('r') === '1'; } catch (e) {}
      if (!ok) { location.replace('/'); return; }
      try { history.replaceState({}, '', '/'); } catch (e) {}  // keep the address bar on /
    })();
  </script>
  <title>/*[|template_title|]*/0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="cache-control" content="max-age=0" />
  <meta http-equiv="cache-control" content="no-cache" />

        navigator.serviceWorker.register('/sw.js').catch(function () {});

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f5f5f7;
      --text-dim: #a1a1a6;
      --text-dimmer: #6e6e73;
      --accent: #0a84ff;
      --danger: #ff453a;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(10, 132, 255, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(125, 80, 240, 0.08) 0%, transparent 45%),
        #000;
      margin: 0;
      overflow: hidden;
    }

    /* Loading spinner */
    .staticrypt-spinner-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .staticrypt-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Main content wrapper */
    .staticrypt-content {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      animation: fadeIn 0.4s var(--ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Login card */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 32px 32px;
      text-align: center;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #4a4a4f 0%, #1d1d1f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 500;
      color: var(--text);
      border: 1px solid var(--border-strong);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .user-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .user-hint {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* Form */
    #staticrypt-form { margin: 0; }

    .staticrypt-password-container {
      position: relative;
      margin-bottom: 12px;
    }

    #staticrypt-password {
      width: 100%;
      height: 44px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 22px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 0 48px 0 18px;
      outline: none;
      text-align: center;
      letter-spacing: 4px;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }

    #staticrypt-password::placeholder {
      color: var(--text-dimmer);
      letter-spacing: 0;
    }

    #staticrypt-password:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.5);
    }

    /* Hide Staticrypt's default password-visibility toggle (kept in DOM for JS compat) */
    .staticrypt-toggle-password-visibility { display: none !important; }

    /* Hide Staticrypt's remember-me checkbox (kept in DOM for JS compat) */
    .staticrypt-remember { display: none !important; }

    /* Submit button — Apple-style arrow */
    .staticrypt-decrypt-button {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--text);
      border: none;
      color: #000;
      cursor: pointer;
      font-size: 0;
      transition: transform 0.15s var(--ease), background 0.15s var(--ease);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12h14M13 5l7 7-7 7'/></svg>");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 16px 16px;
    }

    .staticrypt-decrypt-button:hover { transform: scale(1.05); }
    .staticrypt-decrypt-button:active { transform: scale(0.95); }

    /* Inline error message */
    .err {
      font-size: 12px;
      color: var(--danger);
      height: 16px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.2s var(--ease);
    }
    .err.show { opacity: 1; }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .login-card.shake { animation: shake 0.45s var(--ease); }

    .hidden { display: none !important; }

    /* ============ ENHANCED MOTION + AMBIENCE (LOCK SCREEN) ============ */

    /* Animated mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 22%, rgba(10, 132, 255, 0.22) 0%, transparent 38%),
        radial-gradient(circle at 80% 72%, rgba(125, 80, 240, 0.20) 0%, transparent 38%),
        radial-gradient(circle at 60% 28%, rgba(255, 80, 180, 0.10) 0%, transparent 32%),
        radial-gradient(circle at 30% 88%, rgba(80, 200, 255, 0.14) 0%, transparent 32%);
      animation: meshDrift 32s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes meshDrift {
      0%   { transform: translate3d(0%, 0%, 0) rotate(0deg) scale(1); }
      33%  { transform: translate3d(-3%, 2%, 0) rotate(8deg) scale(1.06); }
      66%  { transform: translate3d(2%, -3%, 0) rotate(-6deg) scale(0.98); }
      100% { transform: translate3d(-1%, 1%, 0) rotate(4deg) scale(1.03); }
    }

    /* Film grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* Login card spring entrance */
    .login-card {
      animation: cardSpringIn 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
      animation-delay: 0.1s;
    }
    @keyframes cardSpringIn {
      from { opacity: 0; transform: translateY(30px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar subtle breathing pulse */
    .avatar {
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .avatar:hover {
      transform: scale(1.04);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(10, 132, 255, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    /* Soft glow ring around the login card */
    .login-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg,
        rgba(10, 132, 255, 0.3),
        transparent 30%,
        transparent 70%,
        rgba(125, 80, 240, 0.3));
      z-index: -1;
      opacity: 0.5;
      filter: blur(8px);
      animation: glowPulse 6s ease-in-out infinite alternate;
    }
    .login-card {
      position: relative;
    }
    @keyframes glowPulse {
      0%   { opacity: 0.3; }
      100% { opacity: 0.7; }
    }

    /* Input focus glow */
    #staticrypt-password:focus {
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
    }

    /* Smooth submit button hover */
    .staticrypt-decrypt-button {
      transition: transform 0.18s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.18s var(--ease);
    }
    .staticrypt-decrypt-button:hover {
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .gh-404 {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      overflow: auto;
      cursor: default;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: auto;
      -moz-osx-font-smoothing: auto;
      --background-color: #fff;
      --error-code-color: rgb(95, 99, 104);
      --heading-color: rgb(32, 33, 36);
      --primary-button-fill-color: rgb(26, 115, 232);

      --text-color: rgb(95, 99, 104);
      background: var(--background-color);
      color: var(--text-color);
      overflow-wrap: break-word;
    }
    @media (prefers-color-scheme: dark) {
      .gh-404 {
        --background-color: rgb(32, 33, 36);
        --error-code-color: rgb(154, 160, 166);
        --heading-color: rgb(154, 160, 166);
        --primary-button-fill-color: rgb(138, 180, 248);
        --primary-button-text-color: rgb(32, 33, 36);
        --text-color: rgb(154, 160, 166);
      }
    }
    .gh-404.fade { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .gh-404 .nt-inner { box-sizing: border-box; font-size: 1em; line-height: 1.6em; margin: 14vh auto 0; max-width: 600px; width: 100%; }
    .gh-404 .nt-icon { user-select: none; display: inline-block; height: 72px; width: 72px; margin: 0 0 40px; background-repeat: no-repeat; background-size: 100%; content: image-set(url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABIAQMAAABvIyEEAAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAENJREFUeF7tzbEJACEQRNGBLeAasBCza2lLEGx0CxFGG9hBMDDxRy/72O9FMnIFapGylsu1fgoBdkXfUHLrQgdfrlJN1BdYBjQQm3UAAAAASUVORK5CYII=") 1x, url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQAQMAAADdiHD7AAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAFJJREFUeF7t0cENgDAMQ9FwYgxG6WjpaIzCCAxQxVggFuDiCvlLOeRdHR9yzjncHVoq3npu+wQUrUuJHylSTmBaespJyJQoObUeyxDQb3bEm5Au81c0pSCD8HYAAAAASUVORK5CYII=") 2x); }
    @media (prefers-color-scheme: dark) { .gh-404 .nt-icon { filter: invert(1); } }
    .gh-404 h1 { color: var(--heading-color); font-size: 1.6em; font-weight: normal; line-height: 1.25em; margin: 0 0 16px; overflow-wrap: break-word; user-select: none; }
    .gh-404 h1 span { font-weight: 500; }
    .gh-404 .nt-msg > p { display: inline; margin: 0; }
    .gh-404 .nt-code { color: var(--error-code-color); font-size: 0.8em; margin-top: 12px; text-transform: uppercase; }
    .gh-404 .nt-nav { margin-top: 51px; }
    .gh-404 .nt-nav::after { clear: both; content: ""; display: table; width: 100%; }
    .gh-404 .nt-reload { border: 0; border-radius: 20px; box-sizing: border-box; background: var(--primary-button-fill-color); color: var(--primary-button-text-color); cursor: pointer; float: right; font-size: 0.875em; margin: 0; padding: 8px 16px; font-family: inherit; user-select: none; }
    @media (max-width: 700px) { .gh-404 .nt-inner { padding: 0 10%; } }
    @media (max-width: 420px) { .gh-404 .nt-inner { padding: 0 5%; } .gh-404 .nt-nav { margin-top: 30px; } .gh-404 .nt-reload { float: none; font-size: 0.825em; font-weight: 500; margin: 0; width: 100%; padding: 16px 24px; } }
    @media (max-width: 420px) and (min-height: 401px) { .gh-404 .nt-nav { background: var(--background-color); bottom: 0; box-shadow: 0 -12px 24px var(--background-color); left: 0; right: 0; margin: 0 auto; max-width: 736px; padding-inline: 24px; position: fixed; width: 100%; z-index: 2; } .gh-404 .nt-inner { max-width: 736px; } }
  </style>
</head>

<body class="staticrypt-body">

  <div id="staticrypt_loading" class="staticrypt-spinner-container">
    <div class="staticrypt-spinner"></div>
  </div>

  <div id="staticrypt_content" class="staticrypt-content hidden">
    <div class="login-card" id="loginCard">
      <div class="avatar">A</div>
      <div class="user-name">alex</div>
      <div class="user-hint">/*[|template_instructions|]*/0</div>

      <form id="staticrypt-form" action="#" method="post">
        <div class="staticrypt-password-container">
          <input
            id="staticrypt-password"
            type="password"
            name="password"
            placeholder="/*[|template_placeholder|]*/0"
            autocomplete="off"
            autofocus
          />
          <img
            class="staticrypt-toggle-password-visibility"
            alt=""
            src="data:image/svg+xml;utf8,<svg/>"
          />
          <button type="submit" class="staticrypt-decrypt-button" aria-label="/*[|template_button|]*/0"></button>
        </div>

        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" />
          /*[|template_remember|]*/0
        </label>
      </form>

      <div class="err" id="errMsg">Incorrect password</div>
    </div>
  </div>

  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const templateError = "/*[|template_error|]*/0",
          templateToggleAltShow = "",
          templateToggleAltHide = "",
          isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
          staticryptConfig = /*[|staticrypt_config|]*/ 0;

    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    };

    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (!isSuccessful) {
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();
      }
    };

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = document.getElementById("staticrypt-password").value;
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, false);
      if (!isSuccessful) {
        const card = document.getElementById("loginCard");
        const err  = document.getElementById("errMsg");
        err.classList.add("show");
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 500);
        const input = document.getElementById("staticrypt-password");
        input.select();
      }
    });
  </script>
</body>
</html>
